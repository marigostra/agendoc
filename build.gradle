
plugins
{
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gluonhq.gluonfx-gradle-plugin' version '1.0.27'
}

group = 'agendoc'
version = '1.0-SNAPSHOT'

dependencies
{
    implementation 'dev.langchain4j:langchain4j:1.9.1'
    implementation 'dev.langchain4j:langchain4j-agentic:1.9.1-beta17'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.9.1'
    implementation 'dev.langchain4j:langchain4j-http-client-jdk:1.9.1'
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

java
{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    modularity.inferModulePath = true
}

tasks.withType(JavaCompile).configureEach
{
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
        '--add-reads', 'agendoc=ALL-UNNAMED'
    ])
}

repositories
{
    mavenCentral()
}

javafx
{
    version = '21'
    modules = ['javafx.controls']
}


test
{
    useJUnitPlatform()
}

application
{
    mainClass = 'agendoc.AgendocApp'
    mainModule = 'agendoc'
    applicationDefaultJvmArgs = [
        '--add-reads', 'agendoc=ALL-UNNAMED'
    ]
}

gluonfx {
    target = 'host'
    reflectionList = [
        'agendoc.AgendocApp',
        'agendoc.AgentTools',
    ]
}

test
{
    afterTest { descriptor, result ->
        if (result.resultType == TestResult.ResultType.FAILURE)
        {
            String testName = descriptor.displayName ?: "${descriptor.className}.${descriptor.name}"
            logger.error("FAILED TEST: ${testName}")

            Throwable exception = result.exception
            if (exception != null)
            {
                logger.error("${exception.class.simpleName}: ${exception.message}")

                StackTraceElement testFrame = exception.stackTrace.find
                {
                    it.className?.startsWith('agendoc')
                }

                if (testFrame != null)
                {
                    logger.error("  at ${testFrame}")
                }
            }
        }
    }
}