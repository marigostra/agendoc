plugins
{
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gluonhq.gluonfx-gradle-plugin' version '1.0.27'
    id 'com.adarshr.test-logger' version  '4.0.0'
}

group = 'agendoc'
version = '1.0-SNAPSHOT'

java
{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach
{
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
        '--add-reads', 'agendoc=ALL-UNNAMED'
    ])
}

repositories
{
    mavenCentral()
}

javafx
{
    version = '21'
    modules = ['javafx.controls']
}

dependencies
{
    implementation 'dev.langchain4j:langchain4j:1.9.1'
    implementation 'dev.langchain4j:langchain4j-agentic:1.9.1-beta17'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.9.1'
    implementation 'dev.langchain4j:langchain4j-http-client-jdk:1.9.1'
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

test
{
    useJUnitPlatform()
}

application
{
    mainClass = 'agendoc.AgendocApp'
    mainModule = 'agendoc'
    applicationDefaultJvmArgs = [
        '--add-reads', 'agendoc=ALL-UNNAMED'
    ]
}

gluonfx {
    target = 'host'

    reflectionList = [
        'agendoc.AgendocApp',
    ]
}

testlogger {
  theme 'plain'
  showExceptions true
  showStackTraces true
  showFullStackTraces false
  showCauses true
  showStandardStreams true
  showPassedStandardStreams true
  showSkippedStandardStreams true
  showFailedStandardStreams true
  showSummary true
}

test {
    testLogging {
      exceptionFormat = 'full'
    }

    afterTest { descriptor, result ->
        if (result.resultType == TestResult.ResultType.FAILURE) {
            String testName = descriptor.displayName ?: "${descriptor.className}.${descriptor.name}"
            logger.error("FAILED TEST: ${testName}")

            Throwable exception = result.exception
            if (exception != null) {
                StringWriter stackTrace = new StringWriter()
                exception.printStackTrace(new PrintWriter(stackTrace))
                logger.error(stackTrace.toString())
            }
        }
    }
}